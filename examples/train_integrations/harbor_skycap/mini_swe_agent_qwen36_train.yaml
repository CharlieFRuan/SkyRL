# mini-swe-agent config for RL training Qwen3.6-35B-A3B on SWE tasks through skycap (run_overfit_qwen36_mini_swe.sh).
# Same layout as mini_swe_agent_qwen36.yaml (the eval config); differences: a step limit and a larger per-turn budget for
# the 128k-token training context. Sampling here is overridden by the trainer: skycap forces generator.sampling_params
# (temperature 1.0, top_p 1.0, top_k -1 in training, so rollout and policy log-probs share one distribution).
agent:
  step_limit: 250
  cost_limit: 0
environment:
  timeout: 600
model:
  model_kwargs:
    drop_params: true
    temperature: 1.0
    max_tokens: 16384
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
        preserve_thinking: true
